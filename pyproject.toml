[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-cli"
version = "0.1.0"
description = "Simple CLI search tool with pluggable index sources"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "exa-py>=2.0",
]

[project.scripts]
search-cli = "search_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
